# Ultimate Collections: the collection settings (paste this whole text into Dashboard > Plugins > Ultimate Collections).
# 19 ready-made collections (7 seasonal, 12 permanent), each with its own poster style.
#
# Only movies that are in the library end up in a collection (matched by TMDb / IMDb id). The plugin only ever changes
# or deletes collections it created itself; a same-named collection made any other way is left alone (warning).
#
# Sources (repeatable; several of one kind = ANY of them):
#   tmdb_keyword <name or id>     TMDb keyword, e.g. christmas, halloween, time travel        (themoviedb.org/keyword/...)
#   tmdb_actor <name or id>       movies with this actor (with tv yes also their shows, from TMDb TV credits)
#   mdblist <user>/<list>         public MDBList list, free, no key                          (mdblist.com/lists/<user>/<list>)
#   title <text>                  library items whose name contains <text> (no API)
#   release_years <from> <to>     all TMDb movies released in these years (use with min_rating / min_votes)
#     min_rating <n>              TMDb average rating at least n (0-10)      } also work together with tmdb_keyword
#     min_votes <n>               at least n TMDb votes (= well-known movies) } and tmdb_actor
# Exclusions (repeatable):
#   exclude_genre <Genre>         TMDb genre: Action, Adventure, Animation, Comedy, Crime, Documentary, Drama, Family,
#                                 Fantasy, History, Horror, Music, Mystery, Romance, Science Fiction, Thriller, War, Western
#   exclude_keyword <name or id>  TMDb keyword
# Boolean (instead of the sources above; several match lines = ANY of them):
#   match <expression>            field:value selectors joined with AND, OR, NOT and ( ); quote values with spaces.
#                                 Emby metadata: tag: genre: studio: rated: title: actor: director: writer: producer:
#                                 person: year:1980..1989 rating:7 critic:80 type:movie|series
#                                 Online: tmdb_keyword: tmdb_actor: mdblist:
#                                 e.g. match actor:"Tom Hanks" AND (genre:War OR tmdb_keyword:"world war ii")
# Other:
#   tv yes                        also include TV shows from the same sources (default: movies only)
#   season MM-DD MM-DD            collection exists only in this window (may wrap the new year); deleted outside it
#   min_items <n>                 fewer matching titles = no collection (default [global] min_items)
#   max_pages <n>                 TMDb pages (20 titles each) per keyword source (default [global] max_pages)
# Poster and backdrop (made by the plugin from the 9 best-rated titles in the collection):
#   poster_title A|B              title lines, '|' = new line; first lines in the accent colour, the last in white
#   poster_accent r,g,b           accent colour (bars + first title lines)
#   poster_tint r,g,b             colour the picture is tinted with
#   poster_sepia yes              old-photo look
#   posters no                    no generated poster/backdrop for this collection
# A '#' after a space starts a comment, so colours are written r,g,b (not #rrggbb).

[global]
min_items          2
max_pages          100
list_refresh_days  7        # lists are downloaded again after this many days (library matching runs every night)

# ---------- seasonal (exist only in their season)
[collection Christmas]
mdblist       k0meta/christmas-extravaganza      # Kometa's community list (~640 titles)
exclude_genre Horror
season        12-01 12-31
poster_title  CHRISTMAS
poster_accent 230,60,60
poster_tint   20,70,35

[collection Halloween]
tmdb_keyword  halloween
season        10-01 10-31
poster_title  HALLOWEEN
poster_accent 255,135,20
poster_tint   40,15,50

[collection Thanksgiving]
tmdb_keyword  thanksgiving
exclude_genre Horror
season        11-01 11-30
poster_title  THANKS|GIVING
poster_accent 230,150,50
poster_tint   80,40,10

[collection Valentine's Day]
tmdb_keyword  valentine's day
exclude_genre Horror
season        02-01 02-15
poster_title  VALENTINE'S|DAY
poster_accent 255,90,140
poster_tint   80,10,35

[collection Summer Time]
tmdb_keyword  summer camp
tmdb_keyword  summer vacation
tmdb_keyword  beach
exclude_genre Horror
season        06-01 08-31
poster_title  SUMMER|TIME
poster_accent 255,170,60
poster_tint   90,45,10

[collection Winter Time]
tmdb_keyword  winter
tmdb_keyword  snow
tmdb_keyword  snowstorm
tmdb_keyword  skiing
tmdb_keyword  ice skating
exclude_genre Horror
exclude_keyword christmas          # Christmas movies live in the Christmas collection
season        12-01 02-29
poster_title  WINTER|TIME
poster_accent 150,205,255
poster_tint   20,45,80

[collection Spring Time]
tmdb_keyword  spring
tmdb_keyword  spring break
tmdb_keyword  easter
exclude_genre Horror
season        03-01 05-31
poster_title  SPRING|TIME
poster_accent 140,220,120
poster_tint   25,70,30

# ---------- permanent (no season)
[collection Time Travel]
tmdb_keyword  time travel
poster_title  TIME|TRAVEL
poster_accent 90,220,255
poster_tint   10,30,70

[collection Dinosaurs]
tmdb_keyword  dinosaur
poster_title  DINOSAURS
poster_accent 170,210,70
poster_tint   35,50,15

[collection Post-Apocalyptic]
tmdb_keyword  post-apocalyptic future
tmdb_keyword  dystopia
poster_title  POST-|APOCALYPTIC
poster_accent 230,120,40
poster_tint   60,35,15

[collection Superheroes]
tmdb_keyword  superhero
poster_title  SUPER|HEROES
poster_accent 240,50,50
poster_tint   15,25,80

[collection True Stories]
tmdb_keyword  based on true story
poster_title  TRUE|STORIES
poster_accent 240,210,120
poster_tint   40,35,25

[collection Trekkie]
title         Star Trek        # every Star Trek movie and series in the library
tv            yes
poster_title  TREKKIE
poster_accent 240,195,40
poster_tint   10,20,60

[collection Top Pre-50's]
release_years 1900 1949
min_rating    7.0
min_votes     500              # older movies have far fewer TMDb votes
poster_title  TOP|PRE-50'S
poster_accent 225,190,120
poster_tint   60,45,20
poster_sepia  yes

[collection Top 50's]
release_years 1950 1959
min_rating    7.0
min_votes     500
poster_title  TOP|50'S
poster_accent 120,220,210
poster_tint   20,50,55
poster_sepia  yes

[collection Top 60's]
release_years 1960 1969
min_rating    7.0
min_votes     750
poster_title  TOP|60'S
poster_accent 255,140,60
poster_tint   70,25,60

[collection Top 70's]
release_years 1970 1979
min_rating    7.0
min_votes     1000
poster_title  TOP|70'S
poster_accent 240,170,40
poster_tint   70,40,10

[collection Top 80's]
release_years 1980 1989
min_rating    7.0              # TMDb average
min_votes     2000             # only well-known movies
poster_title  TOP|80'S
poster_accent 255,60,200
poster_tint   30,10,70

